name: personal_finance
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Firebase ──────────────────────────────────────
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_analytics: ^11.4.1
  google_sign_in: ^6.2.2

  # ── State Management ──────────────────────────────
  flutter_bloc: ^9.1.1
  provider: ^6.1.5+1
  equatable: ^2.0.7

  # ── Navigation ────────────────────────────────────
  go_router: ^14.8.1

  # ── Local Storage (Hive) ──────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # ── Connectivity ──────────────────────────────────
  connectivity_plus: ^6.1.1
  internet_connection_checker: ^1.0.0+1

  # ── Dependency Injection ──────────────────────────
  get_it: ^9.0.0
  injectable: ^2.7.0

  # ── Charts ────────────────────────────────────────
  fl_chart: ^0.70.2

  # ── Icons & Fonts ─────────────────────────────────
  iconsax: ^0.0.8
  google_fonts: ^6.2.1

  # ── Utilities ─────────────────────────────────────
  intl: ^0.20.2
  uuid: ^4.5.1
  dartz: ^0.10.1

  # ── Animations ────────────────────────────────────
  lottie: ^3.3.1
  animate_do: ^3.3.4

  # ── Notifications ─────────────────────────────────
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.2

  # ── Biometric ─────────────────────────────────────
  local_auth: ^2.3.0

  # ── File Sharing ──────────────────────────────────
  share_plus: ^7.2.2
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ── Code Generation ───────────────────────────────
  build_runner: ^2.4.14
  hive_ce_generator: ^1.11.1
  injectable_generator: ^2.12.1

  # ── Testing ───────────────────────────────────────
  bloc_test: ^10.0.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
