# Optimized JVM arguments for faster compilation
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel execution of tasks
org.gradle.parallel=true

# Enable build caching to reuse results from previous builds
org.gradle.caching=true

# Disable configuration caching due to build errors with current plugin versions
org.gradle.configuration-cache=false

# Android specific optimizations
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
